<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sondaggio</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F7F5F0; --card: #FFFFFF; --text: #1A1916; --muted: #6B6860;
    --border: #E2DED6; --radius: 16px; --radius-sm: 10px;
    --yes: #1A6B4A; --yes-light: #E8F5EF;
    --no: #9B3B1E; --no-light: #FAEDEA;
    --A: #EF9F27; --A-light: #FAEEDA; --A-text: #633806;
    --B: #7F77DD; --B-light: #EEEDFE; --B-text: #3C3489;
    --C: #1D9E75; --C-light: #E1F5EE; --C-text: #085041;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem 3rem; }
  .container { width: 100%; max-width: 440px; }
  .logo { text-align: center; margin-bottom: 2rem; font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--muted); }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 2rem 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 1.75rem; }
  .step-dot { height: 3px; border-radius: 2px; flex: 1; background: var(--border); transition: background .3s; }
  .step-dot.active { background: #1A1916; }
  .step-dot.done { background: #1A1916; opacity: 0.25; }
  .question { font-family: 'DM Serif Display', serif; font-size: 1.35rem; line-height: 1.3; margin-bottom: 0.5rem; }
  .subtitle { font-size: 0.875rem; color: var(--muted); margin-bottom: 1.75rem; }
  .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.75rem; }
  .option-btn { width: 100%; padding: 1rem 1.25rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .option-btn:active { transform: scale(0.98); }
  .option-letter { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; flex-shrink: 0; opacity: 0.6; transition: all .2s; }
  .option-btn.sel-A { border-color: var(--A); background: var(--A-light); color: var(--A-text); }
  .option-btn.sel-B { border-color: var(--B); background: var(--B-light); color: var(--B-text); }
  .option-btn.sel-C { border-color: var(--C); background: var(--C-light); color: var(--C-text); }
  .option-btn.sel-A .option-letter { background: var(--A); border-color: var(--A); color: #fff; opacity: 1; }
  .option-btn.sel-B .option-letter { background: var(--B); border-color: var(--B); color: #fff; opacity: 1; }
  .option-btn.sel-C .option-letter { background: var(--C); border-color: var(--C); color: #fff; opacity: 1; }
  .yn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.75rem; }
  .yn-btn { padding: 1.25rem 1rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; text-align: center; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .yn-btn:active { transform: scale(0.97); }
  .yn-btn.yes { border-color: var(--yes); background: var(--yes-light); color: var(--yes); }
  .yn-btn.no  { border-color: var(--no);  background: var(--no-light);  color: var(--no); }
  .yn-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .scale-grid { display: flex; gap: 8px; margin-bottom: 0.5rem; }
  .scale-btn { flex: 1; padding: 1rem 0.5rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer; text-align: center; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .scale-btn:active { transform: scale(0.95); }
  .scale-btn.selected { border-color: var(--B); background: var(--B-light); color: var(--B-text); }
  .scale-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 1.75rem; }
  .slider-wrap { margin-bottom: 1.75rem; }
  .slider-val { text-align: center; font-family: 'DM Serif Display', serif; font-size: 3rem; margin-bottom: 1rem; }
  input[type=range] { width: 100%; height: 6px; border-radius: 3px; appearance: none; background: var(--border); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #1A1916; cursor: pointer; }
  .slider-minmax { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-top: 8px; }
  .mc-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.75rem; }
  .mc-btn { width: 100%; padding: 0.9rem 1.25rem; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--card); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; text-align: left; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .mc-btn:active { transform: scale(0.98); }
  .mc-btn.selected { border-color: var(--C); background: var(--C-light); color: var(--C-text); }
  .primary-btn { width: 100%; padding: 1rem; border-radius: var(--radius-sm); border: none; background: #1A1916; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all .2s; -webkit-tap-highlight-color: transparent; }
  .primary-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .primary-btn:not(:disabled):active { transform: scale(0.98); }
  .badge-A { display:inline-block;padding:3px 10px;border-radius:20px;background:var(--A-light);color:var(--A-text);font-size:.8rem;font-weight:500;margin-bottom:1rem; }
  .badge-B { display:inline-block;padding:3px 10px;border-radius:20px;background:var(--B-light);color:var(--B-text);font-size:.8rem;font-weight:500;margin-bottom:1rem; }
  .badge-C { display:inline-block;padding:3px 10px;border-radius:20px;background:var(--C-light);color:var(--C-text);font-size:.8rem;font-weight:500;margin-bottom:1rem; }
  .success-icon { width: 64px; height: 64px; border-radius: 50%; background: var(--yes-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waiting { text-align: center; padding: 2rem 0; }
  .waiting-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin: 0 3px; animation: blink 1.4s infinite both; }
  .waiting-dot:nth-child(2) { animation-delay: .2s; }
  .waiting-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  /* Riepilogo */
  .riepilogo-item { background: var(--bg); border-radius: var(--radius-sm); padding: 0.9rem 1rem; margin-bottom: 10px; }
  .riepilogo-num { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .riepilogo-q { font-size: 0.875rem; color: var(--muted); margin-bottom: 4px; line-height: 1.4; }
  .riepilogo-a { font-size: 1rem; font-weight: 500; color: var(--text); }
</style>
</head>
<body>
<div class="container">
  <div class="logo">Sondaggio</div>
  <div class="card" id="app">
    <div class="waiting"><div><span class="waiting-dot"></span><span class="waiting-dot"></span><span class="waiting-dot"></span></div></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL  = 'https://jjqcivyfvjunmpxbjkne.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpqcWNpdnlmdmp1bm1weGJqa25lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMjYyNjMsImV4cCI6MjA5MjkwMjI2M30.LFZLV9PzIKH2mPKdg-POY2LPtIVwaT-MVHnYa7V2hhs';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

  const DOMANDE = [
    { tipo: 'sinno',    testo: 'Hai mai partecipato a un evento simile in precedenza?', sottotitolo: 'Scegli una risposta' },
    { tipo: 'numero',   testo: 'Quante ore alla settimana dedichi a questa attivita?', sottotitolo: 'Trascina il cursore', min: 0, max: 60, default: 10 },
    { tipo: 'multipla', testo: 'Quale aspetto trovi piu importante?', sottotitolo: 'Seleziona una risposta', opzioni: ['La qualita dei contenuti', 'Il networking', 'Le opportunita pratiche', 'La formazione teorica'] },
    { tipo: 'scala',    testo: 'Quanto sei soddisfatto di questa esperienza finora?', sottotitolo: 'Valuta da 1 a 5', labelMin: 'Per niente', labelMax: 'Moltissimo' }
  ];

  const COOKIE_GRUPPO   = 'sondaggio_gruppo';
  const COOKIE_ID       = 'sondaggio_uid';
  const COOKIE_PREFIX   = 'sondaggio_r_';

  let gruppo = null;
  let idUtente = null;
  let domandaAttiva = 0;
  let rispostaCorrente = null;
  let risposteDate = {}; // { 1: 'si', 2: '35', ... }
  const app = document.getElementById('app');

  // ─── COOKIE ───────────────────────────────────────────────────────────────
  function setCookie(name, value, hours = 48) {
    const exp = new Date();
    exp.setHours(exp.getHours() + hours);
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${exp.toUTCString()}; path=/`;
  }
  function getCookie(name) {
    const found = document.cookie.split(';').find(c => c.trim().startsWith(name + '='));
    return found ? decodeURIComponent(found.trim().split('=').slice(1).join('=')) : null;
  }
  function haRisposto(n) { return getCookie(COOKIE_PREFIX + n) === '1'; }
  function segnaRisposto(n, val) {
    setCookie(COOKIE_PREFIX + n, '1');
    setCookie('sondaggio_val_' + n, val);
    risposteDate[n] = val;
  }

  // ─── ID ANONIMO ───────────────────────────────────────────────────────────
  function generaId() {
    return Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
  }

  // ─── STEP INDICATOR ───────────────────────────────────────────────────────
  function stepIndicator(attiva) {
    return `<div class="step-indicator">${
      Array.from({length: DOMANDE.length + 1}, (_,i) => {
        const cls = i < attiva ? 'done' : i === attiva ? 'active' : '';
        return `<div class="step-dot ${cls}"></div>`;
      }).join('')
    }</div>`;
  }

  // ─── ROUTER ───────────────────────────────────────────────────────────────
  function render() {
    if (!gruppo) { renderSceltaGruppo(); return; }
    if (domandaAttiva === 0) { renderAttesa("L'evento sta per iniziare..."); return; }
    if (domandaAttiva > DOMANDE.length) { renderRiepilogo(); return; }
    if (haRisposto(domandaAttiva)) { renderGiaRisposto(); return; }
    renderDomanda(domandaAttiva);
  }

  // ─── SCELTA GRUPPO ────────────────────────────────────────────────────────
  function renderSceltaGruppo() {
    app.innerHTML = `
      ${stepIndicator(0)}
      <p class="question">A quale gruppo appartieni?</p>
      <p class="subtitle">Seleziona il tuo gruppo per iniziare</p>
      <div class="options-grid">
        ${['A','B','C'].map(g => `
          <button class="option-btn" id="opt-${g}" onclick="selGruppo('${g}')">
            <span class="option-letter">${g}</span>
            <span>Gruppo ${g}</span>
          </button>`).join('')}
      </div>
      <button class="primary-btn" id="next-btn" onclick="confermGruppo()" disabled>Inizia &#8594;</button>
    `;
  }

  window.selGruppo = function(g) {
    gruppo = g;
    ['A','B','C'].forEach(k => {
      const b = document.getElementById('opt-'+k);
      if (b) b.className = 'option-btn' + (k === g ? ' sel-'+g : '');
    });
    document.getElementById('next-btn').disabled = false;
  };

  window.confermGruppo = function() {
    if (!gruppo) return;
    setCookie(COOKIE_GRUPPO, gruppo);
    render();
  };

  // ─── ATTESA ───────────────────────────────────────────────────────────────
  function renderAttesa(msg) {
    app.innerHTML = `
      <div class="waiting">
        <p style="font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:1.5rem">${msg}</p>
        <div><span class="waiting-dot"></span><span class="waiting-dot"></span><span class="waiting-dot"></span></div>
        <p style="font-size:0.8rem;color:var(--muted);margin-top:1.5rem">Aggiorna la pagina quando ti viene indicato</p>
      </div>`;
  }

  // ─── GIA' RISPOSTO ────────────────────────────────────────────────────────
  function renderGiaRisposto() {
    app.innerHTML = `
      <div style="text-align:center;padding:1.5rem 0">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <p style="font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:0.5rem">Risposta registrata!</p>
        <p style="font-size:0.875rem;color:var(--muted)">In attesa della prossima domanda...</p>
        <div style="margin-top:1.5rem"><span class="waiting-dot"></span><span class="waiting-dot"></span><span class="waiting-dot"></span></div>
      </div>`;
  }

  // ─── RIEPILOGO FINALE ─────────────────────────────────────────────────────
  function renderRiepilogo() {
    const items = DOMANDE.map((d, i) => {
      const n = i + 1;
      const val = risposteDate[n];
      let valLabel = val || '—';
      if (d.tipo === 'sinno') valLabel = val === 'si' ? 'Si' : val === 'no' ? 'No' : '—';
      else if (d.tipo === 'scala') valLabel = val ? `${val} / 5` : '—';
      else if (d.tipo === 'numero') valLabel = val ? `${val} ore` : '—';
      return `
        <div class="riepilogo-item">
          <div class="riepilogo-num">Domanda ${n} · ${d.tipo === 'sinno' ? 'Si/No' : d.tipo === 'numero' ? 'Numero' : d.tipo === 'multipla' ? 'Scelta multipla' : 'Scala 1-5'}</div>
          <div class="riepilogo-q">${d.testo}</div>
          <div class="riepilogo-a">${valLabel}</div>
        </div>`;
    }).join('');

    app.innerHTML = `
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="success-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1A6B4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <p style="font-family:'DM Serif Display',serif;font-size:1.4rem;margin-bottom:0.4rem">Grazie!</p>
        <p style="font-size:0.875rem;color:var(--muted)">Ecco un riepilogo delle tue risposte</p>
      </div>
      <div class="badge-${gruppo}" style="display:block;text-align:center;margin-bottom:1.25rem">Gruppo ${gruppo}</div>
      ${items}`;
  }

  // ─── DOMANDA ──────────────────────────────────────────────────────────────
  function renderDomanda(n) {
    const d = DOMANDE[n - 1];
    rispostaCorrente = null;

    let inputHtml = '';
    if (d.tipo === 'sinno') {
      inputHtml = `<div class="yn-grid">
        <button class="yn-btn" id="btn-si" onclick="selSiNo('si')">Si</button>
        <button class="yn-btn" id="btn-no" onclick="selSiNo('no')">No</button>
      </div>`;
    } else if (d.tipo === 'numero') {
      rispostaCorrente = String(d.default);
      inputHtml = `<div class="slider-wrap">
        <div class="slider-val" id="slider-val">${d.default}</div>
        <input type="range" id="slider-num" min="${d.min}" max="${d.max}" value="${d.default}" step="1">
        <div class="slider-minmax"><span>${d.min}</span><span>${d.max}</span></div>
      </div>`;
    } else if (d.tipo === 'multipla') {
      inputHtml = `<div class="mc-grid">${d.opzioni.map((op,i) =>
        `<button class="mc-btn" id="mc-${i}" onclick="selMC(${i},'${op.replace(/'/g,"\\'")}')">${op}</button>`
      ).join('')}</div>`;
    } else if (d.tipo === 'scala') {
      inputHtml = `
        <div class="scale-grid">${[1,2,3,4,5].map(v =>
          `<button class="scale-btn" id="sc-${v}" onclick="selScala(${v})">${v}</button>`
        ).join('')}</div>
        <div class="scale-labels"><span>${d.labelMin}</span><span>${d.labelMax}</span></div>`;
    }

    app.innerHTML = `
      ${stepIndicator(n)}
      <div class="badge-${gruppo}">Gruppo ${gruppo}</div>
      <p class="question">${d.testo}</p>
      <p class="subtitle">${d.sottotitolo}</p>
      ${inputHtml}
      <button class="primary-btn" id="invia-btn" onclick="inviaRisposta(${n})" ${d.tipo === 'numero' ? '' : 'disabled'}>Invia risposta</button>
    `;

    if (d.tipo === 'numero') {
      const slider = document.getElementById('slider-num');
      const valEl  = document.getElementById('slider-val');
      slider.addEventListener('input', () => {
        valEl.textContent = slider.value;
        rispostaCorrente = slider.value;
      });
    }
  }

  window.selSiNo = function(val) {
    rispostaCorrente = val;
    document.getElementById('btn-si').className = 'yn-btn' + (val==='si' ? ' yes' : '');
    document.getElementById('btn-no').className = 'yn-btn' + (val==='no' ? ' no'  : '');
    document.getElementById('invia-btn').disabled = false;
  };

  window.selMC = function(idx, val) {
    rispostaCorrente = val;
    document.querySelectorAll('.mc-btn').forEach((b,i) => b.className = 'mc-btn' + (i===idx ? ' selected' : ''));
    document.getElementById('invia-btn').disabled = false;
  };

  window.selScala = function(val) {
    rispostaCorrente = String(val);
    [1,2,3,4,5].forEach(v => {
      const b = document.getElementById('sc-'+v);
      if (b) b.className = 'scale-btn' + (v===val ? ' selected' : '');
    });
    document.getElementById('invia-btn').disabled = false;
  };

  // ─── INVIO RISPOSTA ───────────────────────────────────────────────────────
  window.inviaRisposta = async function(n) {
    if (!rispostaCorrente || !gruppo) return;
    const btn = document.getElementById('invia-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Invio...';

    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        const { error } = await supabase.from('risposte').insert({
          id_utente: idUtente,
          gruppo,
          domanda: n,
          valore: String(rispostaCorrente)
        });
        if (error) throw error;
        segnaRisposto(n, rispostaCorrente);
        renderGiaRisposto();
        return;
      } catch(e) {
        if (attempt < 3) await new Promise(r => setTimeout(r, 600 * attempt));
        else {
          btn.disabled = false;
          btn.textContent = 'Errore — Riprova';
          btn.style.background = '#9B3B1E';
        }
      }
    }
  };

  // ─── NESSUN REALTIME — i partecipanti aggiornano la pagina manualmente ──────

  // ─── INIT ─────────────────────────────────────────────────────────────────
  async function init() {
    // Recupera o genera ID anonimo
    idUtente = getCookie(COOKIE_ID);
    if (!idUtente) {
      idUtente = generaId();
      setCookie(COOKIE_ID, idUtente);
    }

    // Recupera gruppo
    gruppo = getCookie(COOKIE_GRUPPO) || null;

    // Recupera risposte già date dai cookie
    DOMANDE.forEach((_, i) => {
      const n = i + 1;
      if (haRisposto(n)) risposteDate[n] = getCookie('sondaggio_val_' + n) || '?';
    });

    const { data, error } = await supabase
      .from('stato_evento').select('domanda_attiva').eq('id','evento').single();

    if (error || !data) {
      app.innerHTML = `<p style="color:#9B3B1E;text-align:center;padding:1rem">Errore di connessione.<br>Ricarica la pagina.</p>`;
      return;
    }

    domandaAttiva = data.domanda_attiva;
    render();
  }


  init();
</script>
</body>
</html>
